# Motor do Prospecta: gosom/google-maps-scraper (open source, MIT), rodando só neste PC.
# Painel e API em http://127.0.0.1:8080. A imagem não tem senha, por isso a porta fica presa em 127.0.0.1.
# Não troque para 0.0.0.0 sem um proxy com autenticação na frente.
name: prospecta
services:
  google-maps-scraper:
    image: gosom/google-maps-scraper:v1.18.1   # versão fixa (a mesma que o kit Mahanaicoach testou em 2026-09-23)
    container_name: gmaps-scraper
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gmaps_data:/gmapsdata   # resultados dos jobs
      - gmaps_cache:/opt        # navegador do Playwright (evita baixar de novo)

volumes:
  gmaps_data:
  gmaps_cache:
